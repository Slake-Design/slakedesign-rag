name: Node.js CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  NODE_VERSION: '22.12.x'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # package-lock.json is generated by npm 11. Reading it with the npm that
      # ships inside Node (10.x) makes `npm ci` reject the tree over optional
      # transitives of @napi-rs/wasm-runtime (pulled in by vitest via rolldown),
      # failing with "Missing: @emnapi/runtime from lock file". That is why this
      # workflow previously fell back to `npm install`, which silently tolerates
      # lockfile drift. Pinning npm to the version that generated the lockfile
      # fixes the mismatch at its source and lets CI use a reproducible install.
      - name: Setup npm
        run: npm install --global npm@11.6.2

      - name: Install Dependencies
        run: npm ci

      # Typecheck before tests. The suite exercises behaviour; this is what
      # catches a type contract broken in a way no test happens to cover, and
      # it runs first so a compile error fails fast with a clearer signal.
      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run Tests
        run: npm test
